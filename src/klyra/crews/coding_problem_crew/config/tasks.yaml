create_coding_problems_task:
  description: >
    Generate coding problems for subject "{subject}" in language
    "{language}" with these requirements: week scope = {syllabus_scope};
    source restriction = {source_filter}; difficulty = {difficulty};
    PYQ-similar count = {pyq_similar_count}; leetcode_similar =
    {leetcode_similar} ("yes" or "no"); include a reference solution in
    the student-facing problems file = {include_reference} ("yes" or "no");
    concepts to target = {concepts} (use these even if no files are
    indexed); total number of problems = {num_questions}; public test
    cases per problem = {public_test_count}; private test cases per
    problem = {private_test_count}. Additional instructions from the
    requester: {notes}

    **STEP 1 — SOURCE GROUNDING:**
    Coding generation does NOT require the syllabus index or ingested
    theory. Call search_coding_sources for this subject (and the requested
    week(s)) FIRST. If lab/assignment/problem-set/code files exist — any
    format: md, pdf, source code, etc. — ground the problems in THOSE
    files, not lecture theory. Theory slides in the same week folders are
    only for concept names. If search_coding_sources finds nothing, that
    is fine: write original problems from --concepts, --notes, the
    language, and the tools below. Do not refuse to generate just because
    nothing is indexed.

    **STEP 2 — PYQ-SIMILAR PROBLEMS:**
    If pyq_similar_count > 0, OR if {notes} asks to follow PYQs, call
    search_pyq (and include any coding PYQ files search_coding_sources
    returned) and write NEW problems testing the same underlying concept
    but using a SUBSTANTIALLY DIFFERENT problem scenario — never copy a PYQ
    verbatim and NEVER just change numbers, variable names, or make slight
    wording tweaks; tag pyq_similar plus which PYQ they're based on.

    **STEP 3 — LEETCODE-SIMILAR PROBLEMS:**
    If leetcode_similar is "yes", OR if {notes}/{concepts} point at
    LeetCode-style work, call search_leetcode with the concepts, the
    subject name, and relevant wording from {notes} (including any PYQ
    text the notes refer to). Inspect a title_slug if you need more
    detail. Then write ORIGINAL problems in LeetCode format (title,
    function/method signature, examples, constraints) testing the same
    concepts but using a SUBSTANTIALLY DIFFERENT problem scenario — never
    copy a LeetCode title, statement, examples, or numbers, and NEVER just
    change variables or make slight tweaks. Tag those problems
    leetcode_similar: true.

    **STEP 4 — PROBLEM STATEMENT & TEST CASES:**
    For every problem, write: a clear problem statement (exact input
    format, output format, constraints/bounds); an explanation ONLY if
    genuinely needed; a hint ONLY if useful without giving the solution
    away; 1-2 sample test cases in the statement; and a full draft test
    set — EXACTLY {public_test_count} public + {private_test_count}
    private — including real edge cases. DO NOT skip any test cases.
    DO NOT use "etc..." or omit the actual data. You MUST write out
    every single test case fully.
    CRITICAL RULE: Every sample test case (Example 1, Example 2, etc.)
    that you put in the problem statement MUST be included as the very
    first items in the draft public test set section. This ensures the
    validator will actually test and correct the examples if your
    hand-calculated expected outputs are wrong.
    CRITICAL REALISM RULE: Both the problem scenario and every public/private
    test case input MUST use realistic, real-time domain data (e.g., realistic
    names like Aarav, Diya, Karthik, Meera, Rohan, Priya, Vikram; real cities,
    department names, product SKUs, server logs, or transaction records). NEVER
    use cliché AI/textbook placeholder names like `Alice`, `Bob`, `Charlie`,
    `Dave`, `John Doe`, `foo`, `bar`, `baz`, or single-letter dummy names
    (`A`, `B`, `C`, `D`) for people/employees/students.

    **STEP 4B — AUTOMATIC DIAGRAMS & COURSE/PYQ NOTATION FIDELITY:**
    Whenever a coding problem involves a graph, tree, linked list, state machine,
    grid/matrix path, class hierarchy, or database ER schema (or when {notes}
    requests a diagram/graph), you MUST automatically call `generate_diagram`
    (or `generate_graph`) with clean LaTeX/TikZ code (`node distance=2.8cm`,
    explicit directed Stealth arrows for directed graphs, and complete
    `ground_truth`) using the EXACT notation, symbols, and vertex/node labels
    used in the course lectures and PYQs (never substitute different symbols that
    have the same meaning), and embed the returned Markdown image link directly
    inside the problem statement / Example 1 explanation so it appears in
    `README.md`. The tool automatically verifies arrow visibility, edge length,
    layout, and course notation consistency and self-regenerates if any visual
    defect is detected.

    **STEP 5 — REFERENCE SOLUTION:**
    A reference solution is NOT required in the student-facing file.
    Include a draft solution (marked NOT student-facing) only if
    include_reference is "yes". You do not have a code execution tool.

    **STEP 6 — FILE PACKAGING:**
    ALWAYS call write_coding_package for this subject="{subject}" and
    name="{name}" so the student package is real files, not just markdown:
    docs/{subject}/generated/coding/{name}/README.md,
    public/test_case_N/input.txt + output.txt,
    private/test_case_N/input.txt + output.txt. (Do NOT pass a custom
    evaluation_script or evaluation_script_filename; Klyra provides a robust
    default runner).
    If {notes} ask for this layout or extra files, follow those notes using
    write_coding_package and/or write_subject_file.
    CRITICAL SUBDIR RULE: When `num_questions` is 1 (single-problem package),
    do NOT pass `problem_subdir` (leave it `None`) so all files live directly
    in `docs/{subject}/generated/coding/{name}/`. ONLY pass `problem_subdir`
    (e.g. `problem-1`, `problem-2`) when `num_questions > 1`.
    Always pass your reference solution to write_coding_package via
    the `reference_solution` parameter so it is saved in the same directory.
    Do not use write_subject_file for the solution. Also populate `public_tests`
    and `private_tests` in your structured output with the exact `stdin_input`
    and `expected_stdout` written to disk (while keeping `sample_tests` strictly
    limited to 1-2 student-facing public examples).

    **LANGUAGE-SPECIFIC RULES:**
    - SQL/PostgreSQL/python-db: If there is an existing database schema
      (e.g. a `schema.sql` or `init.sql` file), include the schema setup
      code in your test case inputs so the validator can populate the
      database before running solutions.

    **SUBJECT SKILL & CODING OUTPUT FORMAT RULES (`docs/{subject}/skill.md`):**
    {subject_skill_rules}
    {subject_coding_format}
  expected_output: >
    For each problem, in markdown: MUST START with a YAML frontmatter block containing tags
    (concept, week, language, marks, pyq_similar, leetcode_similar); a numbered heading;
    the problem statement using standard LeetCode headers (e.g., "### Constraints", "### Example 1");
    an explanation section if included; a hint section if included; then, clearly marked as
    NOT for the student-facing file, the full draft public+private test case sets for the
    validator to check; and a draft reference solution ONLY if include_reference was "yes".
  agent: coding_problem_creator

coding_discrepancy_review_task:
  description: >
    Review the coding problems above for subject "{subject}" (scope
    {syllabus_scope}, language {language}).

    **WORDING & SCOPE CHECK:**
    Flag: ambiguous or under-specified problem statements (unclear I/O
    format, missing constraints, unclear edge-case behavior). Do NOT flag
    a problem as out-of-syllabus merely because the syllabus index is empty
    or was not queried — coding generation does not require indexed theory.
    If search_coding_sources finds real coding-problem files, flag a problem
    that is a verbatim/near-verbatim copy of one of those files.

    **PYQ/LEETCODE ORIGINALITY CHECK:**
    For any problem tagged pyq_similar, use search_pyq to check it's a
    *new* problem. For any problem tagged leetcode_similar, use
    search_leetcode if needed and flag a verbatim copy of a well-known
    LeetCode problem (same title/examples/numbers). If include_reference
    is "no" ({include_reference}), flag any student-facing full reference
    solution.

    **MIX COMPLIANCE & TEST CASE COUNTS:**
    Verify the requested mix: difficulty = {difficulty}, num_questions =
    {num_questions}, pyq_similar_count = {pyq_similar_count},
    leetcode_similar = {leetcode_similar}, public_test_count =
    {public_test_count}, private_test_count = {private_test_count}.
    CRITICAL: You MUST manually count the generated public and private test
    cases. If there are not exactly {public_test_count} public tests and
    {private_test_count} private tests, you MUST flag this as an error. Do
    not simply output "met" if the counts are wrong.

    Do NOT execute or solve any code.
  expected_output: >
    A per-problem discrepancy verdict (wording/scope only) plus a
    mix-compliance summary (difficulty / count / PYQ-similarity /
    LeetCode-similar flag / test-case-counts / reference-solution policy:
    met or not, with specifics).
  agent: coding_discrepancy_reviewer

validate_test_cases_task:
  description: >
    Independently validate the test cases for ALL {num_questions} coding
    problem(s) above, subject "{subject}", language {language}
    (total number of problems = {num_questions}).

    **FOR EVERY PROBLEM (1 through {num_questions}):**
    1. Read the problem statement fresh and write your OWN reference
       solution in {language} (the creator may not have included one —
       that is intentional when include_reference is "no"; do not treat a
       missing creator solution as an error).
    2. Call run_code with your solution against the creator's draft test
       cases (both public and private).
    3. If any test case fails against your independently-correct solution,
       that test case (or the problem statement itself) has a real error —
       decide which, fix it (rewrite the bad test case's expected output,
       or the ambiguous statement detail causing the mismatch), and re-run
       run_code until every test case actually passes against your solution.
    4. Also check the test cases actually distinguish a correct solution
       from a plausible incorrect one (e.g. an off-by-one, or a boundary
       condition) — if a problem's test cases would all pass a subtly wrong
       solution, add a test case that catches it, and validate that too.
    5. Never report a test case or solution as correct without run_code
       actually confirming it passed.

    **LANGUAGE-SPECIFIC RULES:**
    - SQL/PostgreSQL/python-db: If there is an existing database schema
      (e.g., a `schema.sql` or `init.sql` file returned from the sources),
      you MUST supply the exact schema setup code (CREATE TABLE, INSERT
      data, etc) as the `stdin` input for each test case when calling
      run_code, so the sandbox can populate the database before running
      your solution.
    - Bash / sed / awk / gawk: Pass ONLY the raw script in `source_code`:
      * For Bash (`language="bash"`): `#!/bin/bash` followed by commands reading from stdin and writing to stdout.
      * For pure GNU `sed` scripts (`language="sed"`): raw `sed -Ef` script rules (e.g. `s/.../.../g`, `/pattern/d`). Executed via `sed -Ef solution.sed < input.txt`.
      * For standard `awk` scripts (`language="awk"`): raw `awk -f` script rules. Executed via `awk -f solution.awk < input.txt`.
      * For GNU `gawk` scripts (`language="gawk"`): raw `gawk -f` script rules (supports `gensub`, `asort`, `PROCINFO`, `FPAT`, etc.). Executed via `gawk -f solution.awk < input.txt`.
      Do NOT wrap in `cat << 'EOF' > solution.sh`, do NOT invoke `./solution.sh`, and
      do NOT use `python3` (the sandbox only has bash, sed, awk, gawk, grep, coreutils,
      sqlite3). Stdin is fed automatically by the runner.
    - Diagnosing empty stdout: If a test case fails with `actual stdout: ''`
      (empty string) while exit code is 0, do NOT assume the runner failed to
      pipe stdin! Check whether your solution's filter conditions (e.g. grep regexes)
      excluded all input lines, or whether the creator's test case expected output
      contradicts the problem statement criteria. If the draft test case is wrong,
      fix its expected output to match the correct solution output and re-run!

    **TEST CASE COUNT ENFORCEMENT:**
    You MUST strictly count the test cases provided by the creator. There
    must be EXACTLY {public_test_count} public test cases and
    {private_test_count} private test cases per problem. If the creator
    generated fewer, you MUST write the missing test cases yourself (ensure
    they are correct by running them) and include them in the final output.

    **FILE PACKAGING:**
    After the tests are final, call write_coding_package for
    subject="{subject}" name="{name}" with the validated public/private
    cases so docs/{subject}/generated/coding/{name}/public and private
    folders are up to date. (Do NOT pass a custom evaluation_script; Klyra
    provides a robust default runner).

    **MULTIPLE-PROBLEM & PACKAGING RULES:**
    1. When `num_questions` is 1 (single-problem package), you MUST omit
       `problem_subdir` (leave it `None`) so files are written directly to
       `docs/{subject}/generated/coding/{name}/`. ONLY pass `problem_subdir`
       (e.g., `problem-1`, `problem-2`) when `num_questions > 1`.
    2. CRITICAL README FIXING: If you changed the expected output or input
       of a test case that is featured in the problem statement (like
       Example 1, Example 2), YOU MUST explicitly rewrite the README.md to
       reflect this correct output so it does not hallucinate the wrong
       output! Pass the fully corrected markdown text via the `readme`
       parameter to write_coding_package. You MUST strictly preserve its
       YAML frontmatter and standard LeetCode headers. Do not just pass
       the original broken `readme`. Never include private test cases or
       the reference solution in `README.md`.
    3. Pass your verified reference solution code directly to
       `write_coding_package` via the `reference_solution` parameter (do not
       call `write_subject_file` to write `solution.*` and do not pass a custom
       `evaluation_script` or `evaluation_script_filename`). Do not put the
       reference solution in `README.md`.

    Keep your validated solutions in THIS report (testcases.md).
  expected_output: >
    For every problem: the FINAL validated public and private test cases
    (clearly separated, each with exact input and expected output), plus
    YOUR independently-written reference solution in a fenced code block
    (this file is the hidden answer key, not the student paper), plus a
    short validation note per problem - confirmed correct as-is, or what
    was wrong and what you fixed (bad test case, wrong expected output,
    ambiguous statement, etc.) and why.
  agent: test_case_validator

finalize_coding_review_task:
  description: >
    Compare the discrepancy report against the independent test-case
    validation report above for subject "{subject}". Specifically:
    1. If validation found and fixed a real error (bad test case, wrong
       expected output, ambiguous statement) that the discrepancy report
       did NOT flag, add it as a NEW issue.
    2. If the discrepancy report flagged something but validation shows
       the problem is actually fine (tests all pass, statement is clear),
       DROP that flag with a brief explanation.
    3. If both agree on an issue, keep it.
    Give one final overall verdict: ready to use as-is, or needs fixes
    (with the consolidated list of what to fix).
  expected_output: >
    A short final summary: overall verdict + consolidated issue list (or
    "no issues found").
  agent: coding_discrepancy_reviewer
