parse_documents_task:
  description: >
    Parse source files for subject "{subject}" under docs/{subject}/week_1..
    week_12, docs/{subject}/additional, docs/{subject}/pyq, and
    docs/{subject}/transcripts by calling the parse_subject_documents tool
    exactly once with subject="{subject}", week={week_filter} (pass this
    exact value - it is either a specific week number or None to mean "every
    week"), categories_filter={categories_filter} (pass this exact value - it limits parsing to a specific folders like pyq, transcript), file_path={file_path} (pass this exact value), and force={force} (pass this exact boolean - True means re-parse
    every matching file even if unchanged since last time, e.g. to pick up
    newly-added image extraction; False means skip unchanged files as usual).
    Do not invent content for files that failed to parse - report them
    instead.
  expected_output: >
    The tool's summary of files parsed, skipped (unchanged), degraded
    (missing images), and failed, plus any extracted diagram counts.
  agent: document_parser

index_syllabus_task:
  description: >
    For subject "{subject}", build the syllabus index.

    **SKIP CONDITION:** If categories_filter="{categories_filter}" is a
    specific string (not empty) and does NOT contain the word "week", you
    MUST skip this entire task completely because PYQs and transcripts do
    not contain syllabus concepts. However, you MUST echo the exact summary
    output you received from the parse_documents_task so the user knows
    their files were ingested, followed by " (Skipped syllabus indexing
    because category was {categories_filter})."

    **SINGLE-WEEK MODE:** If week={week_filter} is a specific number (not
    None), call fetch_parsed_chunks ONLY for that specific week, extract
    the concepts from the chunks, and call write_syllabus_entries. Skip
    the gap report.

    **ALL-WEEKS MODE:** If week={week_filter} is None, then:
    1. Call report_syllabus_gaps to get the exact list of missing weeks.
    2. Calculate the existing weeks (the ones between 1-12 that are NOT in
       the missing list).
    3. For EVERY single existing week, you MUST call
       fetch_parsed_chunks(subject, week=X). For example, if weeks 1, 5,
       and 6 exist, you MUST make separate fetch_parsed_chunks calls for
       week 1, week 5, and week 6. Do not stop after week 1!
    4. Extract the concepts from the chunks and call write_syllabus_entries.
    Include the result of report_syllabus_gaps verbatim in your final
    answer if it was called.

    CRITICAL: You MUST include the folder/category status for all 4 categories
    (weeks, pyq, transcripts, additional) from parse_documents_task and
    report_syllabus_gaps in your final answer, so the user sees the exact
    file and chunk counts across pyq, transcripts, additional, and weeks.
  expected_output: >
    The complete SyllabusIndexReportOutput including total_chunks_indexed,
    weeks_covered, categories_indexed, missing_weeks (1-12), and indexing_notes
    reporting the status of all 4 folder categories (weeks, pyq, transcripts,
    additional).
  agent: syllabus_indexer
