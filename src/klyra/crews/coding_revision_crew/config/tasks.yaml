revise_coding_problems_task:
  description: >
    Revise the coding problems for subject "{subject}" (language
    {language}) below based on the discrepancy report and test-case
    validation report also below, AND on these specific manual instructions
    from the requester (apply these regardless of whether the automated
    review flagged the same thing - manual instructions are authoritative):
    {manual_instructions}

    Also fix every issue the automated review flagged: rewrite ambiguous
    problem statements, replace any problem that copied a PYQ/LeetCode/
    lab file verbatim, and fix anything the validator's execution found
    wrong (a bad test case, wrong expected output, a solution that didn't
    actually pass). Keep every problem not covered by either the manual
    instructions or the automated review exactly as-is.
    Use search_coding_sources, search_pyq, and search_leetcode to ground any
    new/replacement content when those sources exist - you do not need a
    syllabus index. If you change a test case's expected output or a
    reference solution, use run_code to confirm the fix actually passes
    before finalizing - if Docker/run_code is unavailable, say so and note
    the fix is unverified.

    Manual instructions are authoritative for filesystem layout. You HAVE
    write permission under docs/{subject}/generated/ only. When {manual_instructions}
    ask for README.md, public/test_case_N/input.txt+output.txt,
    private/test_case_N/..., and/or evaluation_script, you MUST actually
    create those folders and files with write_coding_package (and
    write_subject_file for any extra path). Do not only describe the layout
    in markdown - the files must exist on disk.

    CRITICAL PACKAGING & MULTIPLE-PROBLEM RULES:
    1. When revising a single-problem package (only 1 problem in the set), do NOT pass `problem_subdir` (leave it `None`) so files are written directly to `docs/{subject}/generated/coding/{name}/`. ONLY pass `problem_subdir` (e.g., `problem-1`, `problem-2`) when the package contains multiple problems (`num_questions > 1`).
    2. If you fixed a test case that was embedded as an example in the README, you MUST pass the corrected README via the `readme` parameter to write_coding_package so it stays consistent. You MUST strictly preserve its YAML frontmatter and standard LeetCode headers. Never include private test cases or the reference solution in `README.md` or in `sample_tests`.
    3. You MUST pass your verified reference solution code to write_coding_package using the `reference_solution` parameter (do not call write_subject_file to write the solution and do not pass a custom `evaluation_script` or `evaluation_script_filename`).
    4. Populate `public_tests` and `private_tests` in your structured output with the exact `stdin_input` and `expected_stdout` (including full SQL `CREATE TABLE`/`INSERT INTO`/`\copy` setup statements for `python-db`/`postgresql`/`sql` problems) so the downstream validator executes the exact same inputs.
    Subject="{subject}", name="{name}".

    --- ORIGINAL PROBLEMS ---
    {problems_content}

    --- DISCREPANCY REPORT ---
    {discrepancy_content}

    --- TEST-CASE VALIDATION REPORT ---
    {testcases_content}

    --- FINAL SUMMARY (CROSS-CHECKED ISSUES) ---
    {final_summary_content}

    --- SUBJECT SKILL & CODING OUTPUT FORMAT RULES (`docs/{subject}/skill.md`) ---
    {subject_skill_rules}
    {subject_coding_format}
  expected_output: >
    The fully revised set of coding problems in the same markdown format as
    the original (numbered problems, concept/week/language/marks/
    pyq_similar/leetcode_similar tags, problem statement/explanation/hint/
    sample test cases; a reference solution only if the original included one),
    followed by a short changelog listing exactly which problems changed,
    whether each change came from a manual instruction or the automated
    review, and (for any test-case/solution fix) whether run_code confirmed
    it. Also state the on-disk package path that write_coding_package wrote.
  agent: coding_problem_reviser
  output_file: "docs/{subject}/generated/coding/{name}-problems-revised.md"

validate_revised_test_cases_task:
  description: >
    Independently validate every test case for the revised coding problems above,
    subject "{subject}", language {language}.

    1. Execute the revised reference solution against every public and private
       test case using `run_code` with `language="{language}"`. For `python-db`,
       `postgresql`, or `sql` problems, you MUST keep the full SQL seed script
       (`CREATE TABLE`, `INSERT INTO`, `\copy`, etc.) in each test case's `stdin_input`
       (never replace the SQL setup with a bare string) and set `language="{language}"`
       in your output. Confirm that every test case passes cleanly.
    2. If any test case or reference solution was revised, ensure the on-disk package
       files under docs/{subject}/generated/coding/{name} (public/test_case_N,
       private/test_case_N, README.md, and reference_solution) are updated with
       write_coding_package so the filesystem is 100% in sync. Do NOT pass a custom
       `evaluation_script` or `evaluation_script_filename`, and omit `problem_subdir`
       when there is only 1 problem in the package.
    3. Document the execution result for every test case.
  expected_output: >
    A comprehensive test-case execution report detailing the pass/fail status of
    each public and private test case run with run_code, along with confirmation
    of on-disk package updates.
  agent: test_case_validator
  output_file: "docs/{subject}/generated/coding/{name}-testcases-revised.md"

coding_discrepancy_review_revised_task:
  description: >
    Review the revised coding problems above for subject "{subject}" (language {language}).
    Confirm that every issue from the previous discrepancy report:
    {discrepancy_content}
    and final summary has been completely resolved.

    Verify that:
    - Problem statements are unambiguous with clear I/O specifications and constraints.
    - Examples and explanations match the actual test cases.
    - No verbatim copies of PYQ/LeetCode problems exist.
    Do NOT execute or solve any code.
  expected_output: >
    A per-problem discrepancy verdict confirming whether previous issues were resolved
    and confirming the revised problems are clear and unambiguous.
  agent: coding_discrepancy_reviewer
  output_file: "docs/{subject}/generated/coding/{name}-coding-discrepancy-report-revised.md"

finalize_revised_coding_review_task:
  description: >
    Compare the revised coding discrepancy report against the revised test-case validation report
    above for subject "{subject}".
    Confirm that all previous issues are resolved and that all test cases pass cleanly.
    Provide the final readiness verdict for the revised coding problem package.
  expected_output: >
    A short final summary: overall verdict (ready to use / needs fixes) + confirmation of resolved
    issues and package health.
  agent: coding_discrepancy_reviewer
  output_file: "docs/{subject}/generated/coding/{name}-final-summary-revised.md"

