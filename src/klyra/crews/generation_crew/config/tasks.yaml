create_qp_task:
  description: >
    Generate a question paper for subject "{subject}" with these
    requirements: syllabus scope = {syllabus_scope}; source restriction =
    {source_filter}; difficulty = {difficulty}; number of PYQ-similar
    questions required = {pyq_similar_count}; concepts to target =
    {concepts}; question types and counts = {question_types}; total number
    of questions = {num_questions}. Additional instructions from the
    requester: {notes}

    **STEP 1 — SCOPE & GROUNDING:**
    Call list_source_files first. You can generate the question paper from ANY
    available material for "{subject}" — whether from week resources
    (week_1..week_12, additional, transcripts via search_syllabus) OR from the
    PYQ bank (pyq/ via fetch_pyq_chunks and search_pyq), whether already
    indexed in the vector store or available directly on disk (just like coding
    problem generation).
    - If syllabus/week files exist for the requested scope, use search_syllabus
      to ground questions in those concepts.
    - If the syllabus index or requested week folders are empty, DO NOT refuse
      to generate the paper! Instead, seamlessly use fetch_pyq_chunks and
      search_pyq (and/or any other available subject files, --concepts, --notes,
      and the subject's skill.md domain rules) to generate all {num_questions}
      requested questions.
    - If source_filter is not "any", call list_source_files first to resolve it
      to a matching source_file, then pass source_file= to search_syllabus /
      search_pyq / fetch_pyq_chunks.

    If concepts is "any": derive from syllabus/week files when available, else
    from the PYQ bank and subject domain rules.

    **STEP 2 — PYQ-SIMILAR QUESTIONS & COURSE NOTATION FIDELITY:**
    If pyq_similar_count > 0, OR if you are generating from the PYQ bank
    because syllabus is empty, use fetch_pyq_chunks / search_pyq to find
    real PYQs and write NEW questions that test the same underlying concept
    but use a SUBSTANTIALLY DIFFERENT problem scenario — never copy a PYQ
    verbatim and NEVER just change numbers, variable names, or make slight
    wording tweaks; tag which questions are PYQ-similar plus which PYQ they
    were inspired by. Do not pass week= to search_pyq.
    CRITICAL NOTATION RULE: Different textbooks use different symbols for the
    same meaning. You MUST strictly use the EXACT notation, symbols, vertex/node
    labels, variable names, and operator syntax used in the course lectures and
    PYQs (e.g. in CT: 0-indexed integer graph vertices 0, 1, 2, 3, 4, 5 with
    vertex list ListV and adjacency matrix M[i][j], list helpers first(L),
    last(L), rest(L), init(L), ++, and flowchart ovals/rounded-rectangles/diamonds;
    in DBMS: Chen ER notation and T1, T2 schedule graphs).

    **STEP 3 — AUTOMATIC DIAGRAMS & VISUAL VERIFICATION:**
    Whenever any question involves or benefits from a visual structure (graph,
    tree, B-tree, ER diagram, state machine, logic circuit, block diagram,
    architecture diagram, flow chart, etc.), you MUST automatically generate
    and embed a diagram during paper creation — never wait for a separate prompt.
    Call search_images first to find reference material and verify the course's
    and PYQs' visual notation and symbol conventions. NEVER embed raw images
    from search_images directly, as they are often messy video screenshots.
    Instead, work out the exact logical structure yourself, using the EXACT
    course and PYQ notation and symbols (never substitute alternative symbols
    that have the same meaning — e.g. in CT graphs use 0-indexed integer vertex
    labels 0, 1, 2, 3, 4, 5 matching ListV and M[i][j] rather than S1, S2 or
    v1, v2; use DIRECTED graphs with Stealth arrowheads and generous node
    spacing >= 2.8cm; use proper Chen ER symbols for DBMS). Then call
    `generate_diagram` (or `generate_graph`) with LaTeX/TikZ to render it. The
    tool automatically inspects the rendered PNG for invisible arrowheads, short
    edges, overlapping labels, and course/PYQ notation consistency, and
    regenerates the diagram if any issue is found. Always pass a complete
    `ground_truth` (every node/edge or cell using the exact same symbols as the
    question text) so the review/solve agents can verify the question, and place
    the returned `![caption](...)` markdown link in the question's
    `diagram_markdown` field. If generate_diagram is unavailable or fails to
    compile, write the question as text-only rather than fabricating a diagram
    reference.

    **STEP 4 — APPLIED/COMPUTATIONAL QUESTIONS & REALISTIC DATA:**
    For applied/computational concepts (e.g. algorithm tracing,
    mathematical derivations, logic/state manipulations) — write an actual
    problem with concrete data (a specific state, specific numbers/values,
    specific code logic), asking the student to derive/compute a specific
    result.
    CRITICAL REALISM RULE: Always use realistic, real-time scenarios and
    authentic data (e.g., realistic Indian/global names like Aarav, Diya,
    Karthik, Meera, Rohan, Priya, Vikram; real cities/stations like Chennai,
    Bengaluru, Mumbai, Delhi, Hyderabad; realistic university courses, hospital
    records, e-commerce transactions, sensor readings, or server logs). NEVER
    use cliché AI/textbook placeholder tokens like `Alice`, `Bob`, `Charlie`,
    `Dave`, `Eve`, `John Doe`, `foo`, `bar`, `baz`, `Widget A`, or `Company X`.

    **STEP 5 — TONE & LANGUAGE:**
    Write questions using clear, simple, and minimal text. The output must
    feel entirely human-generated, strictly avoiding lengthy AI-like
    conversational filler, overly dramatic scenarios, or robotic phrasing.
    Get straight to the point while testing the core concept effectively.
    All output must be in English unless the requester explicitly specifies
    otherwise.

    **STEP 6 — NO EMBEDDED ANSWERS:**
    Do NOT include answers, solutions, or 'Answer: X' in the question paper markdown.
    The question paper must strictly contain questions, option choices (for MCQ/MSQ),
    marks, and metadata tags for student examination use. All definitive answers,
    derivations, and solutions must be generated by the solver in the independent answer key.

    **STEP 7 — SUBJECT SKILL & OUTPUT FORMAT RULES (`docs/{subject}/skill.md`):**
    {subject_skill_rules}
    {subject_diagram_rules}
    {subject_qp_format}

    If any required parameter above is missing or unclear, state exactly
    what's missing instead of guessing.
  expected_output: >
    The full question paper in markdown (clean examination questions for students without embedded answers):
    numbered questions, each tagged with type, concept, week, marks, and pyq_similar
    (plus the source PYQ when true); MCQ/MSQ questions include lettered options; questions backed
    by a diagram include the embedded markdown image (reused or generated).
  agent: qp_creator

discrepancy_review_task:
  description: >
    Review the question paper above for subject "{subject}" (scope
    {syllabus_scope}). Flag ambiguous wording, structurally invalid options
    (e.g. an MSQ with only one correct option, or an MCQ where two options
    both look correct). If search_syllabus returns real entries for this
    scope, confirm every question's concept/week is traceable there and
    list any that are not as out-of-syllabus. If the syllabus index is
    empty, do NOT refuse the review and do NOT flag out-of-syllabus for
    that reason — call fetch_pyq_chunks / search_pyq and check questions
    are grounded in the PYQ bank instead.

    **DIAGRAM VERIFICATION:**
    For any question with an embedded diagram, you cannot see the rendered
    image — call search_images with a query matching its caption/topic to
    retrieve its full indexed ground truth (this works for both reused and
    freshly-generated diagrams), and use that text to check the question is
    actually answerable and unambiguous from the diagram; if search_images
    returns nothing useful for a diagram-based question, flag that as a
    discrepancy rather than assuming the diagram is fine. You do NOT have
    diagram generation tools — if a diagram is wrong, flag it as a
    discrepancy; do not attempt to fix or regenerate it.

    **PYQ-SIMILARITY CHECK:**
    For any question tagged pyq_similar, use search_pyq to check it's
    genuinely a *new* question (different wording/numbers/scenario) and not
    a verbatim or near-verbatim copy of the PYQ it's based on — flag it if
    it is.

    **MIX COMPLIANCE:**
    Also verify the requested mix was met: difficulty = {difficulty},
    question_types = {question_types}, num_questions = {num_questions},
    pyq_similar_count = {pyq_similar_count}. Do not solve the questions
    yourself.
  expected_output: >
    A per-question discrepancy verdict plus a mix-compliance summary
    (difficulty / types / count / PYQ-similarity: met or not, with
    specifics).
  agent: discrepancy_reviewer

solve_verify_task:
  description: >
    Independently solve every question in the paper above for subject
    "{subject}" from first principles — do not trust any answer key already
    in the paper. Use search_syllabus when it has entries; otherwise use
    fetch_pyq_chunks / search_pyq. Ground each solution in real source
    material and cite the concept/week (or PYQ source) you used. Do not
    refuse to solve because the syllabus index is empty if PYQs exist.

    **DIAGRAM-BASED QUESTIONS:**
    For any question with an embedded diagram, you cannot see the rendered
    image — call search_images with a query matching its caption/topic to
    retrieve its full indexed ground truth (nodes/edges/cells) and solve
    from that text, not from assumptions about what the image probably
    shows; if search_images returns nothing useful, say the question can't
    be independently verified rather than guessing. If a diagram is
    incorrect or broken, flag it in your report — do not attempt to
    regenerate it yourself (you do not have diagram generation tools).

    **COMPUTATIONAL QUESTIONS:**
    For computational/procedural questions (algorithm tracing, numerical
    computations, derivations, etc.), actually perform the derivation step
    by step (e.g. trace the loops, apply the algorithm step by step, show
    the intermediate states) and show that work — a bare final answer is
    not sufficient for these.

    If a question has more than one valid answer, or none, say so
    explicitly.

    **SUBJECT ANSWER KEY FORMAT RULES (`docs/{subject}/skill.md`):**
    {subject_answer_key_format}
  expected_output: >
    A definitive answer key: for every question, the correct option(s)/value,
    the full derivation/working for computational questions, and a short
    justification citing the concept/week used.
  agent: solver_verifier

finalize_review_task:
  description: >
    Compare the discrepancy report against the independent answer key above
    for subject "{subject}". Specifically:
    1. If the answer key found more than one valid answer (or none) for a
       question that the discrepancy report did NOT flag, add it as a NEW
       issue.
    2. If the discrepancy report flagged something but the answer key shows
       the question is actually fine (e.g. the solver found exactly one
       correct answer with clear justification), DROP that flag with a
       brief explanation of why it was a false alarm.
    3. If both agree on an issue, keep it.
    Give one final overall verdict: ready to use as-is, or needs fixes
    (with the consolidated list of what to fix, referencing question
    numbers).
  expected_output: >
    A short final summary: overall verdict + consolidated issue list (or
    "no issues found").
  agent: discrepancy_reviewer
