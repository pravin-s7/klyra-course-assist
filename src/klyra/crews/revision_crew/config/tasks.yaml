revise_qp_task:
  description: >
    Revise the question paper for subject "{subject}" below based on the
    discrepancy report and independent answer key also below, AND on these
    specific manual instructions from the requester (apply these regardless
    of whether the automated review flagged the same thing - manual
    instructions are authoritative): {manual_instructions}

    Also fix every issue the automated review flagged: rewrite ambiguous
    questions/options, correct any out-of-syllabus question (replace it with
    an in-syllabus one on the same concept/week scope if possible, else drop
    it and note the drop), fix structurally invalid options (e.g. more than
    one defensible correct answer for an MCQ), and correct the requested mix
    (difficulty / question types / count / PYQ-similarity) if the final
    summary says it wasn't met. Keep every question not covered by either
    the manual instructions or the automated review exactly as-is. Use
    search_syllabus when it has entries; if the syllabus is empty, ground
    replacements in fetch_pyq_chunks / search_pyq. Never invent syllabus
    content and never guess the course from the subject slug. Do not treat
    "syllabus index missing" as a reason to refuse revision when PYQs exist.

    **CRITICAL REQUIREMENT:** For any replaced or newly written question, 
    ensure it uses clear, simple, and minimal text. The output must feel 
    entirely human-generated. Strictly avoid lengthy AI-like conversational 
    filler, overly dramatic scenarios, or robotic phrasing. Get straight to the point.

    If a replacement question concerns a diagram-based concept (block diagram,
    logic circuit, state machine, architecture diagram, flow chart, etc.), call search_images
    first and embed a genuinely relevant result; if none exists and the
    diagram is specific to this question's own data, work out the correct
    structure yourself, paying close attention to the domain semantics of the subject 
    (e.g. use DIRECTED graphs for CT, precise logic gates for circuits, proper ER 
    symbols for DBMS, etc). Then call generate_diagram (LaTeX/TikZ) to render it,
    always passing a complete ground_truth (every node/edge/cell) since
    review/solve agents cannot see the rendered image - never fabricate a
    diagram reference, and never guess the structure before calling
    generate_diagram. If a question is flagged as a too-close PYQ copy,
    rewrite it to be similar in concept/difficulty but never verbatim.

    --- ORIGINAL QUESTION PAPER ---
    {qp_content}

    --- DISCREPANCY REPORT ---
    {discrepancy_content}

    --- INDEPENDENT ANSWER KEY ---
    {answer_key_content}

    --- FINAL SUMMARY (CROSS-CHECKED ISSUES) ---
    {final_summary_content}

    --- SUBJECT SKILL & OUTPUT FORMAT RULES (`docs/{subject}/skill.md`) ---
    {subject_skill_rules}
    {subject_diagram_rules}
    {subject_qp_format}
    **IMPORTANT:** DO NOT include the solution key or answers inside the revised question paper. Output ONLY the clean student-facing examination paper (numbered questions, type/concept/week/marks/pyq_similar tags, lettered options for MCQ/MSQ), followed by a short changelog listing exactly which questions changed, whether each change came from a manual instruction or the automated review, and why. The revised answer key and review will be generated by the subsequent verifier tasks.
  expected_output: >
    The fully revised question paper in markdown (clean examination questions for students without embedded answers), followed by a short changelog.
  agent: qp_reviser
  output_file: "docs/{subject}/generated/{qp_name}-qp-revised.md"

solve_verify_revised_task:
  description: >
    Independently solve every question in the revised question paper above for
    subject "{subject}" from first principles — do not trust any provisional answers.
    Use search_syllabus when it has entries; otherwise use fetch_pyq_chunks / search_pyq.
    Ground each solution in real source material and cite the concept/week (or PYQ source)
    you used.

    **DIAGRAM-BASED QUESTIONS:**
    For any question with an embedded diagram, call search_images with a query matching
    its caption/topic to retrieve its full indexed ground truth (nodes/edges/cells) and solve
    from that text. If a diagram is incorrect or broken, flag it in your report.

    **COMPUTATIONAL QUESTIONS:**
    For computational/procedural questions (algorithm tracing, numerical computations, derivations,
    etc.), actually perform the derivation step by step and show that work.

    If a revised question has more than one valid answer, or none, say so explicitly.

    **SUBJECT ANSWER KEY FORMAT RULES (`docs/{subject}/skill.md`):**
    {subject_answer_key_format}
  expected_output: >
    A definitive revised answer key: for every question in the revised paper, the correct
    option(s)/value, the full derivation/working for computational questions, and a short
    justification citing the concept/week used.
  agent: solver_verifier
  output_file: "docs/{subject}/generated/{qp_name}-answer-key-revised.md"

discrepancy_review_revised_task:
  description: >
    Review the revised question paper above for subject "{subject}".
    Verify that every issue flagged in the original discrepancy report and final summary:
    {final_summary_content}
    has been completely and accurately resolved by the revision pass.

    Also check the revised paper fresh:
    - Flag any ambiguous wording or structurally invalid options.
    - Confirm all questions align with the syllabus scope or PYQ grounding.
    - Check any questions tagged pyq_similar to ensure they are original questions.
    - Confirm the requested question types and difficulty are met.
    Do not solve the questions yourself.
  expected_output: >
    A per-question discrepancy verdict confirming whether previous issues were resolved
    and confirming the revised question paper is intellectually sound and unambiguous.
  agent: discrepancy_reviewer
  output_file: "docs/{subject}/generated/{qp_name}-discrepancy-report-revised.md"

finalize_revised_review_task:
  description: >
    Compare the revised discrepancy report against the independent revised answer key above
    for subject "{subject}".
    1. Cross-check solver findings against reviewer verdicts.
    2. Confirm whether all previous issues from the original review were successfully resolved.
    3. Give one final overall verdict for the revised paper: ready to use as-is, or needs fixes.
  expected_output: >
    A short final summary for the revised paper: overall verdict + confirmation of resolved
    issues and any remaining notes.
  agent: discrepancy_reviewer
  output_file: "docs/{subject}/generated/{qp_name}-final-summary-revised.md"

