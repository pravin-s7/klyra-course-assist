# YAML anchor for common service configurations to adhere to DRY principles
x-klyra-common: &klyra-common
  build: .
  env_file:
    - .env
  environment:
    - HOME=/tmp
    - CREWAI_STORAGE_DIR=/tmp/crewai_storage
    - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
    - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-klyra}:${POSTGRES_PASSWORD:-klyrapass}@db:5432/${POSTGRES_DB:-klyradb}}
    - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
  volumes:
    - ./docs:/app/docs
    - ./.db:/app/.db
    # Share /tmp and docker.sock so Docker-outside-of-Docker code execution
    # can bind-mount temporary /tmp/klyra-batch-* sandboxes into sibling containers
    - /tmp:/tmp
    - /var/run/docker.sock:/var/run/docker.sock

services:
  web:
    <<: *klyra-common
    ports:
      - "${WEB_PORT:-8765}:8765"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    <<: *klyra-common
    entrypoint: []
    command: celery -A klyra.celery_app worker --loglevel=${CELERY_LOGLEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-klyra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-klyrapass}
      - POSTGRES_DB=${POSTGRES_DB:-klyradb}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klyra} -d ${POSTGRES_DB:-klyradb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  cli:
    <<: *klyra-common
    entrypoint: ["klyra"]
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
