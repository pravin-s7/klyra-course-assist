[project]
name = "klyra"
version = "0.1.0"
description = "Klyra: a multi-agent CrewAI system that turns week-wise subject documents into generated + reviewed question papers and coding problem sets."
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.201.0",
    "chromadb>=0.5.0",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.1.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "celery[redis]>=5.4.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "qdrant-client>=1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
voice = ["pyaudio>=0.2.14"]

[project.scripts]
klyra = "klyra.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
